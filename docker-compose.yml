services:
  redis:
    image: redis:alpine
    container_name: nigoh_redis
    restart: always
    # ═══════════════════════════════════════════════════════════════
    # MUHIM: Redis endi PAROL talab qiladi (--requirepass).
    # Parol .env dagi REDIS_PASSWORD dan olinadi. Django channel layer
    # ham AYNAN shu parol bilan ulanishi SHART (.env dagi REDIS_URL):
    #     REDIS_URL=redis://:<REDIS_PASSWORD>@redis:6379/0
    # Agar ikkala parol mos kelmasa — WebSocket connect() 500 beradi va
    # hech bir PC "online" bo'lmaydi (aynan shu nosozlik bor edi).
    #
    # 3 qavat himoya:
    # 1) --save '' + --appendonly no   → persistence yo'q, restart'da toza state
    # 2) --replica-read-only no        → agar biror sabab bilan replica bo'lsa ham yozadi
    # 3) HEALTHCHECK har 30 sek        → replica holati aniqlansa avto SLAVEOF NO ONE
    # ═══════════════════════════════════════════════════════════════
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD}"
      --save ""
      --appendonly no
      --replica-read-only no
      --protected-mode no
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    healthcheck:
      # PING + role tekshirish (endi PAROL bilan). Replica bo'lsa master ga o'giradi.
      test: >
        sh -c "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" PING > /dev/null &&
               (redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" INFO replication | grep -q 'role:master' ||
                redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" SLAVEOF NO ONE)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    # XAVFSIZLIK: Redis portini FAQAT server ichida (localhost) ochamiz.
    # web konteyner unga docker ichki tarmog'i orqali 'redis:6379' bilan kiradi —
    # tashqi internetga ochish SHART EMAS va xavfli edi (buzib kirish yo'li).
    ports:
      - '127.0.0.1:6379:6379'

  db:
    image: postgres:15-alpine
    container_name: nigoh_db
    restart: always
    # ═══════════════════════════════════════════════════════════════
    # Postgres tuning — connection va performance:
    #  max_connections=300  — 30+ PC uchun yetadi (default 100 kam edi)
    #  shared_buffers=256MB — cache (RAM ning ~25%)
    #  work_mem=8MB         — har query uchun temporary xotira
    # DB fayllari SAQLANADI (postgres_data volume) — hech qanday yo'qotish yo'q.
    # ═══════════════════════════════════════════════════════════════
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=256MB
      -c work_mem=8MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    # XAVFSIZLIK: Postgres ham FAQAT server ichida (localhost) ochiladi.
    # web konteyner unga 'db:5432' orqali kiradi; tashqi internetga chiqarmaymiz.
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    container_name: nigoh_web
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    # web faqat redis SOG'LOM (parol bilan PING o'tgach) bo'lgandan keyin ishga tushadi.
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_started
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PYTHONUNBUFFERED=1
    pids_limit: -1
    security_opt:
      - seccomp=unconfined
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

volumes:
  postgres_data:
